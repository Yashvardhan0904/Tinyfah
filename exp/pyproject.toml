[project]
name = "tinyfah-exploit"
version = "0.1.0"
description = "Authorized non-destructive exploitation agent using TinyFish and LangGraph"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=1.1.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=1.0.0",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "playwright>=1.47.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
